<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unified Pet Dashboard</title>

<!-- External Stylesheet -->
<link rel="stylesheet" href="style.css">

<!-- Socket.io Client Library -->
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>

<body>

<div class="welcome-bar" id="welcomeBar"></div>

<div class="dashboard">
    <div class="pet-grid" id="petGrid"></div>
</div>

<div class="bottom-nav">
    <div class="nav-item" onclick="location.href='Dashboard.html'">
        <span>🏠</span>
    </div>

    <div class="nav-item" id="teamIcon" onclick="location.href='TeamProfile.html'">
        <span>👥</span>
        <div class="notify-dot"></div>
    </div>

    <div class="nav-item" onclick="openPrimaryUser()">
        <span>🧑</span>
    </div>

    <div class="nav-item" onclick="checkIfAllTasksDone()" id="resetNavItem">
        <span>🔄</span>
    </div>
</div>

<!-- Normal Reset Popup -->
<div id="resetPopup" class="popup-overlay">
    <div class="popup-box">
        <div style="font-size:18px;font-weight:bold;margin-bottom:10px;">Reset Today?</div>
        <div style="font-size:14px;color:#444;margin-bottom:20px;">
            This will clear all ✔️ ticks for today.<br>Logs will stay safe.
        </div>
        <button class="popup-btn" style="background:#4A90E2;color:white;" onclick="confirmResetDay()">Yes, Reset</button>
        <button class="popup-btn" style="background:#ccc;color:#333;" onclick="closeResetPopup()">Cancel</button>
    </div>
</div>

<!-- Warning Popup -->
<div id="warningPopup" class="popup-overlay">
    <div class="popup-box">
        <div style="font-size:18px;font-weight:bold;margin-bottom:10px;">Tasks Not Completed</div>
        <div style="font-size:14px;color:#444;margin-bottom:20px;">
            Some tasks are still unfinished.<br>Reset anyway?
        </div>
        <button class="popup-btn" style="background:#E74C3C;color:white;" onclick="confirmResetDay()">Yes, Reset Anyway</button>
        <button class="popup-btn" style="background:#ccc;color:#333;" onclick="closeWarningPopup()">Cancel</button>
    </div>
</div>

<script>
// Connect to your Render backend via Socket.io for live multi-device syncing
const socket = io(); 

let pets = [];
let care = [];
let assigned = [];
let petLogs = [];

socket.on('initial-tasks', () => { renderDashboard(); });
socket.on('task-updated', () => { renderDashboard(); });

function notifyResetNeeded() {
    const today = new Date().toDateString();
    const lastReset = localStorage.getItem("lastReset");
    const resetBtn = document.getElementById("resetNavItem");

    if (lastReset !== today) {
        resetBtn.classList.add("reset-alert");
    } else {
        resetBtn.classList.remove("reset-alert");
    }
}

function setWarmMessage() {
    const header = document.getElementById("welcomeBar");
    const messages = [
        "🐾 Your pets are lucky to have you.",
        "💙 Today feels like a good day.",
        "🌼 A calm day for you and your pets.",
        "☀️ Hope today treats you kindly.",
        "🐶 Your pets appreciate you more than you know.",
        "🌿 Slow and steady — you’re doing great.",
        "✨ You’re keeping everything running smoothly.",
        "🧡 A peaceful day starts with you.",
        "🌞 You bring good energy to your pets.",
        "🐾 Everything feels in harmony today."
    ];
    header.innerHTML = messages[Math.floor(Math.random() * messages.length)];
}

function randomInterval() {
    return Math.floor(Math.random() * ((120*60*1000) - (5*60*1000))) + (5*60*1000);
}

function scheduleRandomMessageChange() {
    setTimeout(() => {
        setWarmMessage();
        scheduleRandomMessageChange();
    }, randomInterval());
}

function updateTeamIconNotification() {
    const teamIcon = document.getElementById("teamIcon");
    if (!teamIcon) return;

    const anyUnassigned = care.some(c =>
        !assigned.some(a => a.careId === c.id)
    );

    const oldDot = teamIcon.querySelector(".notify-dot");
    if (oldDot) oldDot.remove();

    if (anyUnassigned) {
        const dot = document.createElement("span");
        dot.className = "notify-dot";
        dot.style.position = "absolute";
        dot.style.top = "7px";
        dot.style.right = "7px";
        teamIcon.style.position = "relative";
        teamIcon.appendChild(dot);
    }
}

function extractPetId(item) {
    for (const key in item) {
        if (key.toLowerCase().includes("pet")) return item[key];
    }
    return null;
}

function getTaskIcon(name) {
    name = name.toLowerCase();
    if (name.includes("feed")) return "🍽";
    if (name.includes("water")) return "💧";
    if (name.includes("walk")) return "🚶";
    if (name.includes("med")) return "💊";
    if (name.includes("clean")) return "🧼";
    if (name.includes("groom")) return "✂️";
    return "🐾";
}

function todayKey() {
    return new Date().toISOString().split("T")[0];
}

function getCompletedCountToday(petId, careId) {
    return petLogs.filter(log =>
        log.petId === petId &&
        log.careId === careId &&
        log.date === todayKey()
    ).length;
}

function renderDashboard() {
    pets = JSON.parse(localStorage.getItem("pets") || "[]");
    care = JSON.parse(localStorage.getItem("care") || "[]");
    assigned = JSON.parse(localStorage.getItem("assigned") || "[]");
    petLogs = JSON.parse(localStorage.getItem("petLogs") || "[]");

    const petGrid = document.getElementById("petGrid");
    petGrid.innerHTML = "";

    pets.forEach(pet => {
        const petTasks = care.filter(c => Number(extractPetId(c)) === Number(pet.id));
        const hasUnassignedCare = petTasks.some(t =>
            !assigned.some(a => a.careId === t.id)
        );

        const card = document.createElement("div");
        card.className = "pet-card";

        let photoHTML = `
            <div class="pet-left">
                <div class="photo-wrapper" style="position:relative; display:inline-block;">
                    <img class="pet-photo" src="${pet.photo}" onclick="window.location.href='PetProfile.html?id=${pet.id}'">
                    ${hasUnassignedCare ? `<span class="notify-dot"></span>` : ""}
                </div>
                <div class="pet-name">${pet.name}</div>
            </div>
        `;

        let html = photoHTML + `
            <div class="pet-right">
                <div class="task-header">Daily Tasks</div>
        `;

        petTasks.forEach(t => {
            const total = t.times;
            const done = getCompletedCountToday(pet.id, t.id);

            let ticks = "";
            for (let i = 0; i < done; i++) {
                ticks += "<span style='color:green; font-size:18px;'>✔️</span>";
            }

            html += `
                <div class="pet-task-item">
                    ${getTaskIcon(t.name)} ${t.name}
                    <span class="task-amount">(${total}x)</span> 
                    ${ticks}
                </div>
            `;
        });

        html += `</div>`;
        card.innerHTML = html;
        petGrid.appendChild(card);
    });

    updateTeamIconNotification();
}

document.addEventListener("DOMContentLoaded", () => {
    notifyResetNeeded();
    setInterval(notifyResetNeeded, 60000);

    setWarmMessage();
    scheduleRandomMessageChange();
    document.getElementById("welcomeBar").onclick = () => setWarmMessage();

    renderDashboard();
});

function openPrimaryUser() {
    const users = JSON.parse(localStorage.getItem("users") || "[]");
    if (users.length === 0) return;
    window.location.href = `UserProfile.html?id=${users[0].id}`;
}

function openResetPopup() {
    document.getElementById("resetPopup").style.display = "flex";
}
function closeResetPopup() {
    document.getElementById("resetPopup").style.display = "none";
}
function openWarningPopup() {
    document.getElementById("warningPopup").style.display = "flex";
}
function closeWarningPopup() {
    document.getElementById("warningPopup").style.display = "none";
}

function checkIfAllTasksDone() {
    let totalTasks = 0;
    let completedTasks = 0;

    pets.forEach(pet => {
        const petTasks = care.filter(c => Number(c.petId) === Number(pet.id));
        petTasks.forEach(t => {
            totalTasks += t.times;
            const done = getCompletedCountToday(pet.id, t.id);
            completedTasks += done;
        });
    });

    if (completedTasks >= totalTasks) {
        openResetPopup();
    } else {
        openWarningPopup();
    }
}

function confirmResetDay() {
    let petLogs = JSON.parse(localStorage.getItem("petLogs") || "[]");
    const today = todayKey();
    let yesterday = new Date();
    yesterday.setDate(yesterday.getDate() - 1);
    const yDate = yesterday.toISOString().split("T")[0];

    petLogs = petLogs.map(log => {
        if (log.date === today) {
            return { ...log, date: yDate };
        }
        return log;
    });

    localStorage.setItem("petLogs", JSON.stringify(petLogs));
    localStorage.setItem("userProfileButtons", "blue");
    localStorage.setItem("lastReset", new Date().toDateString());

    closeResetPopup();
    closeWarningPopup();
    document.getElementById("resetNavItem").classList.remove("reset-alert");
    location.reload();
}
</script>

</body>
</html>
