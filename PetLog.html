<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pet Log</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
    background: #EAF3FF;
    height: 100%;
    overflow: hidden;
}

.header-bar {
    background: #4A90E2;
    padding: 16px;
    color: white;
    width: 100%;
    height: 100px;
    box-sizing: border-box;
    display: flex;
    align-items: center;
    gap: 16px;
    position: relative;
}

.pet-photo {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid white;
    box-shadow: 0 3px 8px rgba(0,0,0,0.25);
}

.header-info {
    display: flex;
    flex-direction: column;
    justify-content: center;
    flex-grow: 1;
}

.pet-name {
    font-size: 22px;
    font-weight: bold;
    margin: 0;
}

.pet-species {
    font-size: 14px;
    opacity: 0.9;
    margin-top: 2px;
}

.back-icon {
    background: rgba(255,255,255,0.25);
    width: 40px;
    height: 40px;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 20px;
    color: white;
    cursor: pointer;
    box-shadow: 0 3px 8px rgba(0,0,0,0.2);
}

.container {
    width: 92%;
    margin: auto;
    padding-bottom: 120px;
    height: calc(100% - 120px);
    overflow-y: auto;
}

.section {
    background: white;
    padding: 15px;
    border-radius: 14px;
    margin-top: 20px;
    box-shadow: 0 3px 8px rgba(0,0,0,0.15);
}

.section h2 {
    margin: 0 0 10px 0;
    font-size: 20px;
    color: #2C3E50;
}

.filter-bar {
    display: flex;
    gap: 10px;
    margin-bottom: 12px;
}

.filter-btn {
    padding: 8px 14px;
    border-radius: 10px;
    border: none;
    font-weight: bold;
    cursor: pointer;
    color: white;
}

.filter-active {
    background: #4A90E2;
}

.filter-inactive {
    background: #999;
}

.log-entry {
    background: #FFFFFF;
    padding: 14px;
    border-radius: 14px;
    border: 1px solid #D7E4F7;
    margin-bottom: 12px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
}

.log-user {
    font-size: 15px;
    color: #4A90E2;
    font-weight: bold;
    margin-bottom: 6px;
}

.log-text {
    font-size: 14px;
    color: #2C3E50;
    display: flex;
    align-items: center;
    gap: 6px;
}

/* ⭐ UNIFIED BOTTOM NAV — MATCHES ALL SCREENS */
.bottom-nav {
    background: #4A90E2;
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;

    height: 50px;
    display: flex;
    align-items: center;
    justify-content: space-around;

    font-size: 22px;
    padding: 0;
    color: white;

    box-shadow: 0 -2px 6px rgba(0,0,0,0.15);
}

.nav-item {
    text-align: center;
    cursor: pointer;

    display: flex;
    align-items: center;
    justify-content: center;

    height: 100%;
    width: 60px;
    position: relative;
}

.notify-dot {
    width: 12px;
    height: 12px;
    background: red;
    border-radius: 50%;
    border: 2px solid white;
    position: absolute;

    top: 7px;
    right: 7px;

    z-index: 10;
}

/* Toast */
.toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: #333;
    color: white;
    padding: 12px 18px;
    border-radius: 8px;
    font-size: 15px;
    opacity: 0;
    transition: opacity 0.4s ease, bottom 0.4s ease;
    z-index: 9999;
}
.toast.show {
    opacity: 1;
    bottom: 40px;
}
  
</style>
  
</head>
<body>

<div class="header-bar">
    <img id="photo" class="pet-photo">
    <div class="header-info">
        <div id="name" class="pet-name"></div>
        <div id="species" class="pet-species"></div>
    </div>
    <div class="back-icon" onclick="location.href='PetProfile.html?id=' + petId">⬅️</div>
</div>

<div class="container">
    <div class="section">
        <h2>Log Book</h2>

        <div class="filter-bar">
            <button id="btnToday" class="filter-btn filter-active" onclick="setFilter('today')">Today</button>
            <button id="btnAll" class="filter-btn filter-inactive" onclick="setFilter('all')">All</button>
        </div>

        <div id="logList"></div>
    </div>
</div>

<div class="bottom-nav">
    <div class="nav-item" onclick="location.href='Dashboard.html'">🏠</div>
    <div class="nav-item" onclick="location.href='TeamProfile.html'">👥</div>
    <div class="nav-item" onclick="location.href='PetProfile.html?id=' + petId">🐾</div>
    
</div>

<script>
const params = new URLSearchParams(window.location.search);
const petId = Number(params.get("id"));

let pets = JSON.parse(localStorage.getItem("pets") || "[]");
let petLogs = JSON.parse(localStorage.getItem("petLogs") || "[]");

const pet = pets.find(p => Number(p.id) === petId);

if (!pet) {
    showToast("Pet not found");
    window.location.href = "Dashboard.html";
}

document.getElementById("photo").src = pet.photo || "https://cdn-icons-png.flaticon.com/512/194/194938.png";
document.getElementById("name").textContent = pet.name;
document.getElementById("species").textContent = pet.type || "Pet";

let currentFilter = "today";

function setFilter(type) {
    currentFilter = type;

    document.getElementById("btnToday").className =
        type === "today" ? "filter-btn filter-active" : "filter-btn filter-inactive";

    document.getElementById("btnAll").className =
        type === "all" ? "filter-btn filter-active" : "filter-btn filter-inactive";

    renderLog();
}

function formatDate(dateString) {
    const d = new Date(dateString);
    return `${d.getDate()}/${d.getMonth()+1}/${d.getFullYear()}`;
}

function getLogIcon(text) {
    text = text.toLowerCase();
    if (text.includes("feed")) return "🍽";
    if (text.includes("water")) return "💧";
    if (text.includes("walk")) return "🚶";
    if (text.includes("med") || text.includes("pill")) return "💊";
    if (text.includes("groom")) return "✂️";
    if (text.includes("clean")) return "🧼";
    return "🐾";
}

function renderLog() {
    const list = document.getElementById("logList");
    list.innerHTML = "";

    const today = new Date().toDateString();

    let logsForPet = petLogs.filter(l => l.petId === pet.id);

    if (currentFilter === "today") {
        logsForPet = logsForPet.filter(l => new Date(l.date).toDateString() === today);
    }

    logsForPet.sort((a, b) => b.id - a.id);

    logsForPet.forEach(log => {
        const div = document.createElement("div");
        div.className = "log-entry";

        div.innerHTML = `
            <div class="log-user">${log.userName}</div>
            <div class="log-text">
                ${getLogIcon(log.text)} ${log.text}
            </div>
            <div class="log-text" style="opacity:0.7;">
                🕒 ${log.time} • 📅 ${formatDate(log.date)}
            </div>
        `;

        list.appendChild(div);
    });
}

renderLog();

/* Toast */
function showToast(message) {
    const toast = document.createElement("div");
    toast.className = "toast";
    toast.innerText = message;

    document.body.appendChild(toast);

    setTimeout(() => toast.classList.add("show"), 10);
    setTimeout(() => {
        toast.classList.remove("show");
        setTimeout(() => toast.remove(), 400);
    }, 2500);
}
</script>

</body>
</html>
